<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Estado de Prendas | Terno Gabriel</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" />
    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/empleado/prendas.css}" />
    <link rel="stylesheet" th:href="@{/css/responsive.css}" />
    <link rel="stylesheet" th:href="@{/css/fluido.css}" />
  </head>

  <body class="page-empleado-prendas">
    <div class="app-shell">
      <aside
        th:replace="~{fragments/sidebar-empleado :: sidebar('prendas')}"
      ></aside>

      <main class="main">
        <header
          th:replace="~{fragments/mobile-header :: mobile-header}"
        ></header>

        <div class="page-header">
          <div>
            <span class="frame-label">E-08</span>
            <h1>Estado de Prendas</h1>
            <p>Disponibilidad y ubicación del inventario</p>
          </div>
          <div class="header-actions">
            <button
              class="icon-btn notification"
              data-action="notify"
              aria-label="Notificaciones"
              title="Notificaciones"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
                <path d="M10 21h4" /></svg
              ><i></i>
            </button>
            <div class="date-block">
              <span>Hoy</span><strong data-current-date>-- --- ----</strong>
            </div>
          </div>
        </div>

        <div class="content">
          <section class="card inventory-card">
            <div class="pr-head">
              <div class="pr-title">
                <h2 data-pr-titulo>Inventario de prendas</h2>
                <p class="subtitle-stats">
                  0 prendas registradas · 0 disponibles
                </p>
              </div>
              <div class="pr-filtros">
                <select class="pr-select" data-state-filter aria-label="Estado">
                  <option value="Todos">Todos los estados</option>
                  <option value="Disponible">Disponible</option>
                  <option value="Alquilado">Alquilado</option>
                  <option value="En confección">En confección</option>
                  <option value="Confecciones">Confecciones realizadas</option>
                  <option value="En lavandería">Lavandería</option>
                  <option value="En restauración">Restauración</option>
                </select>
                <div class="pr-buscar">
                  <svg
                    class="pr-lupa"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                    fill="none"
                    aria-hidden="true"
                  >
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                  <input
                    class="pr-input"
                    data-table-search
                    placeholder="Código o nombre"
                    aria-label="Buscar"
                  />
                </div>
              </div>
              <button type="button" class="pr-vendidos" data-vendidos>
                Vendidos
              </button>
            </div>

            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th class="col-codigo">CÓDIGO</th>
                    <th class="col-nombre">NOMBRE</th>
                    <th class="col-talla">TALLA</th>
                    <th class="col-estado">ESTADO</th>
                    <th class="col-responsable">CLIENTE / ORDEN</th>
                    <th class="col-accion">ACCIÓN</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div th:replace="~{fragments/toast :: toast('Cambios guardados')}"></div>
    <script th:src="@{/js/api.js}" defer></script>
    <script th:src="@{/js/historial.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
    <script th:src="@{/js/empleado/prendas.js}" defer></script>
  </body>
</html>
